steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/staging/web.Dockerfile
      - -t
      - ${_IMAGE}
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP}
      - --build-arg=NEXT_PUBLIC_TWILIO_SANDBOX_NUMBER=${_TWILIO_NUMBER}
      - .
images: ['${_IMAGE}']
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
