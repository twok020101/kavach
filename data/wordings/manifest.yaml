# Public Indian health insurance policy wordings used by the Proof page evals (WP-11).
#
# The PDFs are not committed. `pnpm wordings:fetch` downloads them into data/wordings/pdfs/
# (git-ignored) and prints each file's SHA-256 to copy into `sha256` below.
# Labels for each wording: data/wordings/labels/<uin>.json (shape: WordingLabel in
# packages/schemas/src/proof.ts). Value conventions for the person checking them:
#   null        not labelled yet (not scored)
#   "none"      the wording has no such limit / condition (e.g. no room rent cap, co-pay at all ages)
#   "schedule"  set in the policy schedule, not the wording (e.g. a super top-up deductible; not scored)
#   rupees      limits written as "% of sum insured" are labelled at referenceSumInsured (Rs 5,00,000),
#               applying any rupee cap, e.g. "1% of SI up to Rs 5,000" -> 5000
#   nonPayables true when the wording points to the non-payable items list (IRDAI List I / Annexure)
# Set checkedBy and checkedAt once every field has been checked against the PDF.
#
# Mix (docs/plan/03 §9.1): 8 insurers; individual, floater, senior, super top-up, 3 group
# wordings and the IRDAI standard product Arogya Sanjeevani. IRDAI-hosted copies are the
# filed versions; a later version of the same product has a different UIN.
wordings:
  - uin: NIAHLIP25044V022425
    insurer: The New India Assurance Co. Ltd.
    product: Arogya Sanjeevani Policy
    segment: standard
    source: insurer
    url: https://www.newindia.co.in/assets/docs/know-more/health/arogya-sanjeevani/POLICY%20CLAUSES%20Arogya%20Sanjeevani.pdf
    sha256: null
    note: >-
      Search found this file at uatportalug.newindia.co.in (same path); the CIS and prospectus
      for the same UIN are at this www.newindia.co.in path. Confirm the link on first fetch.

